     index.html draws the newest edition; ?edition=YYYYMMDD draws an older one (only ids listed in EDITIONS load).
     Each edition is one data file: editions/weekly-digest-YYYYMMDD.js. Pictures: pictures/<name>-YYYYMMDD.<ext>.
     Look: the Anthropic IPO guide's colors and letters (its fonts are reused from ../anthropic-ipo/fonts/),
     over the spinning galaxies from AI Discord Presence. -->

<style>
@font-face{font-family:Abl;src:url(../anthropic-ipo/fonts/anton-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:Blk;src:url(../anthropic-ipo/fonts/bungee-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:SM;src:url(../anthropic-ipo/fonts/space-mono-latin-400-normal.woff2) format('woff2');font-display:swap}
@font-face{font-family:SM;font-weight:700;src:url(../anthropic-ipo/fonts/space-mono-latin-700-normal.woff2) format('woff2');font-display:swap}
/* the Anthropic IPO guide's palette */
:root{--bg:#1d2752;--card:#26315f;--lav:#c9b6ff;--peach:#f5a98a;--mint:#8fe3c4;--pink:#ff8fd2;--ink:#e9e4ff;--mut:#a9a6cf;--line:#3a4680;--neon:#ff3fd0;--lemon:#f8ffa6}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:SM,ui-monospace,Menlo,Consolas,monospace;min-height:100vh;overflow-x:hidden}
a{color:inherit;text-decoration:none}
b{font-weight:700;color:var(--lemon)}
code{font-family:SM,monospace;font-size:.92em;color:var(--mint);background:rgba(143,227,196,.1);padding:0 4px;border-radius:4px}

/* ---- the sky: AI Discord Presence's galaxies, slowly spinning (clockwise, so their arms trail) ---- */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--bg)}
.gx{position:absolute;width:clamp(560px,96vmin,1120px);aspect-ratio:1/1;background:center/contain no-repeat;mix-blend-mode:screen;will-change:transform;animation:spin 360s linear infinite}
.gx.a{background-image:url(pictures/galaxy-anthropic-20261120.jpg);top:-24%;right:-26%;opacity:.9}
.gx.o{background-image:url(pictures/galaxy-openai-20261120.jpg);bottom:-30%;left:-30%;opacity:.82;animation-duration:480s}
.sky::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 38%,rgba(29,39,82,.05),rgba(29,39,82,.45))}
@keyframes spin{to{transform:rotate(360deg)}}

.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:60px 40px 44px}

/* ---- header ---- */
.kick{font-family:Blk;font-size:13px;letter-spacing:1px;color:var(--mint);text-transform:uppercase}
.kick i,.tagline i{font-style:normal;color:var(--mut);margin:0 6px}
.stack{position:relative;display:block;line-height:.9;margin:22px 0 0;font-weight:400}
.stack span{display:block;color:transparent;-webkit-text-stroke:2.4px var(--lav)}
.stack .l2,.stack .l3{position:absolute;left:0;top:0}
.stack .l1{position:relative;z-index:3;color:var(--bg)}
.stack .l2{-webkit-text-stroke-color:var(--peach);transform:translate(var(--o),var(--o));z-index:2}
.stack .l3{-webkit-text-stroke-color:var(--mint);transform:translate(calc(var(--o)*2),calc(var(--o)*2));z-index:1}
#title{font-family:Abl;font-size:clamp(74px,19vw,184px);--o:.036em;letter-spacing:.01em}
.tagline{font-family:Blk;font-size:15px;letter-spacing:.5px;color:var(--lav);margin:40px 0 0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 0;text-transform:uppercase}
.for{color:var(--pink)}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:16px;margin-right:12px}
.eq span{width:4px;height:100%;border-radius:1px;background:var(--mint);transform-origin:bottom;animation:eq 1.1s ease-in-out infinite}
.eq span:nth-child(2){background:var(--peach);animation-delay:-.35s}.eq span:nth-child(3){background:var(--lav);animation-delay:-.7s}
.eq span:nth-child(4){background:var(--pink);animation-delay:-.2s}.eq span:nth-child(5){background:var(--neon);animation-delay:-.55s}
@keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
.intro{margin:22px 0 0;max-width:760px}
.intro p{font-size:16px;line-height:1.6;margin-top:10px}
.toc{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:34px 0 0}
.toc a{display:block;background:rgba(38,49,95,.82);border:2px solid var(--line);border-radius:12px;padding:9px 11px 10px;font-size:12.5px;line-height:1.3;color:var(--ink);transition:border-color .2s,box-shadow .2s}
.toc a:hover,.toc a:focus-visible{border-color:var(--neon);box-shadow:0 0 12px rgba(255,63,208,.4);outline:none}
.toc a span{display:block;font-family:Blk;font-size:14px;color:var(--pink);margin-bottom:2px}
hr{border:0;border-top:2px solid var(--line);margin:34px 0 30px}

/* ---- the numbered items ---- */
.sec{display:grid;grid-template-columns:56px 1fr;gap:0 4px;margin-bottom:26px;scroll-margin-top:18px}
.n{font-family:Blk;font-size:22px;color:var(--pink);padding-top:22px;text-shadow:0 0 14px rgba(255,143,210,.45)}
.card{background:rgba(38,49,95,.84);border:2px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:20px 22px 22px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 10px 30px rgba(10,14,40,.35)}
.c1{--c:var(--mint)}.c2{--c:var(--peach)}.c3{--c:var(--lav)}.c4{--c:var(--pink)}
.hrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;margin-bottom:14px}
.h{font-family:Blk;font-weight:400;font-size:21px;line-height:1.2;color:var(--lav);letter-spacing:.5px;text-transform:uppercase}
.tag{font-family:SM;font-weight:700;font-size:11.5px;letter-spacing:1px;text-transform:uppercase;color:#ff7ae0;border:2px solid var(--neon);border-radius:999px;padding:3px 10px;background:rgba(255,63,208,.08);box-shadow:0 0 10px rgba(255,63,208,.3);white-space:nowrap}
.pics{display:grid;gap:12px}
.pics.two{grid-template-columns:1fr 1fr;align-items:start}
.pic{border:2px solid var(--c);border-radius:12px;overflow:hidden;background:#0b0f24;box-shadow:0 0 16px color-mix(in srgb,var(--c) 35%,transparent)}
.pic img{display:block;width:100%;height:auto}
.pic img.px{image-rendering:pixelated;background:#000}
.golist{display:flex;flex-direction:column;gap:4px;margin:12px 0 0}
.go{font-weight:700;font-size:14.5px;color:var(--mint);word-break:break-word}
.go:hover,.go:focus-visible{color:var(--lemon);outline:none;text-decoration:underline;text-underline-offset:3px}
.gn{font-size:12.5px;color:var(--mut);margin-left:6px;font-weight:400}
.p{font-size:15.5px;line-height:1.6;margin-top:12px}
.subs{display:grid;grid-template-columns:repeat(var(--k,3),1fr);gap:12px;margin-top:16px}
.sub{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:rgba(29,39,82,.55)}
.sh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
.subn{font-family:Blk;font-size:13px;color:var(--pink)}
.st{font-family:Blk;font-size:14px;color:var(--peach);letter-spacing:.3px;text-transform:uppercase}
.sub p{font-size:14px;line-height:1.55}
.sub .go{display:inline-block;font-size:13px;margin-top:8px}
.note{font-size:14px;line-height:1.6;color:var(--mut);margin-top:14px;border-left:3px solid var(--c);padding-left:12px}
.note b{color:var(--ink)}

/* ---- the end ---- */
.outro{font-family:Blk;font-size:clamp(24px,4.4vw,40px);text-align:center;margin:40px 0 0;color:var(--ink)}
.outro span{background:linear-gradient(90deg,var(--mint),var(--lav),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.credits{margin:36px auto 0;max-width:820px;font-size:12px;line-height:1.6;color:var(--mut);list-style:none}
.credits li{margin-top:6px;padding-left:16px;position:relative}
.credits li::before{content:"✦";position:absolute;left:0;color:var(--lav)}
.foot{margin-top:30px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);padding:14px 0;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}
.ft{font-family:SM,monospace;font-size:20px;color:#f4f4ff}
.sp{width:26px;height:26px;display:block}
.star{width:60px;height:60px;display:block}
.gh{width:34px;height:34px;color:#f4f4ff;display:block}
.fail{margin-top:30px;color:var(--peach)}

@media (max-width:860px){
  .toc{grid-template-columns:repeat(2,1fr)}
  .subs{grid-template-columns:1fr}
}
@media (max-width:640px){
  .wrap{padding:30px 16px 30px}
  .tagline{font-size:13px;margin-top:30px}
  .sec{grid-template-columns:1fr}
  .n{padding:0 0 6px 4px;font-size:18px}
  .card{padding:16px 14px 18px}
  .h{font-size:18px}
  .pics.two{grid-template-columns:1fr}
  .p{font-size:15px}
  .ft{font-size:17px}
}
@media (prefers-reduced-motion:reduce){
  .gx,.eq span{animation:none}
  html{scroll-behavior:auto}
}
